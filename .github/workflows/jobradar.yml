name: JobRadar

on:
    # schedule:
    #   # Uma vez por hora, fora do minuto 0 (horário de maior congestionamento
    #   # dos runners agendados do GitHub Actions).
    #   - cron: "17 * * * *"
    workflow_dispatch: {}

concurrency:
    group: jobradar-cycle
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    buscar-vagas:
        runs-on: ubuntu-latest
        # O perfil Brasil leva em torno de 7-12 min nas execuções medidas. Este
        # limite ainda dá folga para lentidão das fontes, mas encerra um ciclo
        # travado antes do próximo disparo horário. cancel-in-progress=false
        # preserva o ciclo atual e evita perder o estado do banco no meio dele.
        timeout-minutes: 55
        steps:
            - name: Checkout do repositório
              uses: actions/checkout@v4

            - name: Configurar Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Instalar dependências
              run: |
                  pip install -r requirements.txt
                  python -m playwright install --with-deps chromium

            - name: Rodar JobRadar (um ciclo do perfil Brasil)
              env:
                  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
              run: python main.py --perfil brasil --once

            - name: Salvar vagas já vistas (evita notificação duplicada)
              run: |
                  git config user.name "jobradar-bot"
                  git config user.email "jobradar-bot@users.noreply.github.com"

                  git add data/jobs.db
                  if git diff --cached --quiet; then
                    echo "Nada novo pra commitar."
                    exit 0
                  fi
                  git commit -m "chore: atualiza vagas vistas [skip ci]"

                  # Se outro push (execução concorrente, ou push manual) chegou
                  # primeiro, o push abaixo é rejeitado. Em vez de falhar o run
                  # (o que faria a vaga ser notificada de novo no próximo ciclo),
                  # sincroniza e tenta de novo. data/jobs.db é binário (SQLite):
                  # em caso de conflito, quem deve vencer é a versão deste run
                  # (base + vagas encontradas agora), não a de origin/main.
                  #
                  # MEDIDO: estava "-X ours", que em `git merge` de fato mantém o
                  # lado local — mas em `git rebase` a semântica é invertida: o
                  # rebase reaplica os commits deste run EM CIMA de origin/main, e
                  # nesse processo "ours" passa a se referir à branch de destino
                  # (origin/main), "theirs" ao commit sendo reaplicado (este run).
                  # Confirmado com um repositório de teste isolado: rebase com
                  # "-X ours" manteve o conteúdo do upstream, descartando o local.
                  # Resultado real: toda vez que o push colidia, o jobs.db commitado
                  # voltava a ser o de origin/main — vaga encontrada e notificada
                  # neste run desaparecia do banco (reaparecia como "nova" no ciclo
                  # seguinte) e qualquer backfill de coluna (ex: chave_secundaria)
                  # também era descartado, mesmo rodando com sucesso a cada
                  # iniciar_db(). Corrigido para "-X theirs" — mesmo teste isolado,
                  # resultado contrário: manteve a versão deste run.
                  n=0
                  until git push; do
                    n=$((n + 1))
                    if [ "$n" -ge 5 ]; then
                      echo "Push falhou depois de 5 tentativas."
                      exit 1
                    fi
                    echo "Push rejeitado, sincronizando (tentativa $n)..."
                    git fetch origin main
                    git rebase origin/main -X theirs || git rebase --abort
                    sleep $((RANDOM % 5 + 1))
                  done
